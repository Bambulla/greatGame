<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="panel">
        <h1>🐍 Змейка</h1>
        <div class="stats">
          <span>Счёт: <strong id="score">0</strong></span>
          <span>Рекорд: <strong id="high-score">0</strong></span>
        </div>
      </header>

      <canvas id="board" width="480" height="480" aria-label="Игровое поле"></canvas>

      <section class="controls">
        <p>Управление: стрелки или WASD. Нажми <kbd>Space</kbd> для паузы.</p>
        <button id="restart" type="button">Начать заново</button>
      </section>
    </main>

    <script src="snake.js"></script>
  </body>
</html>
